<title>Black Friday Pé de Serra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: faixa azul da marca com a logo e o período, depois vitrine de ofertas por categoria em cartões, botão fixo de WhatsApp */
:root{
  --bg:#F2F5FF; --surface:#FFFFFF; --fg:#0A1033; --muted:#55608A; --line:#D3DBFA;
  --blue:#0940FA; --green:#6DE223; --on-green:#0A1033; --price:#0940FA;
  --display:'Anton',Impact,'Arial Narrow',sans-serif; --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#070B24; --surface:#101746; --fg:#F2F5FF; --muted:#A9B4E8; --line:#26327A; --price:#9DB3FF; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#070B24; --surface:#101746; --fg:#F2F5FF; --muted:#A9B4E8; --line:#26327A; --price:#9DB3FF; color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;padding-bottom:96px}
.wrap{width:100%;max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{position:relative;background:var(--green);padding-bottom:30px}
.hero::before{content:"";position:absolute;inset:0;background:var(--blue);clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),0 calc(100% - 52px))}
.hero .wrap{position:relative;padding-top:28px;padding-bottom:86px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.logo{width:112px;height:112px;border-radius:50%;display:block}
.hero h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(64px,19vw,120px);line-height:.92;color:#fff;letter-spacing:.01em}
.hero h1 span{color:var(--green);display:block}
.marcas{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px clamp(16px,4vw,32px);padding:0;margin-top:18px}
.marcas img{display:block;width:auto;min-width:0}
.marcas img:nth-child(1){height:clamp(34px,10vw,48px)}
.marcas img:nth-child(2){height:clamp(32px,9vw,44px)}
.marcas img:nth-child(3){height:clamp(24px,7vw,34px)}
.marcas img:nth-child(4){height:clamp(16px,4.6vw,22px)}
.when{background:var(--green);color:var(--on-green);font-weight:800;border-radius:99px;padding:8px 18px;font-size:15px;letter-spacing:.04em}
.how{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;color:#fff;font-weight:700;font-size:14px}
.how b{border:1.5px solid #fff;border-radius:99px;padding:5px 12px;font-weight:700}
main{padding-top:6px;padding-bottom:20px}
section{margin-top:30px}
.head{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;text-align:center}
.head h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px;line-height:1;letter-spacing:.02em;text-wrap:balance}
.brand{height:56px;width:auto;display:block}
.brand.wide{height:44px;order:-1}
.combo{position:relative;padding-top:30px !important;margin-top:24px;background:#0A1033;border:3px solid var(--green);border-radius:16px;padding:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px;text-align:center;color:#fff}
.combo .fotos3{display:flex;align-items:center;flex:none}
.combo .fotos3 img{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:12px;border:2px solid #0A1033;position:relative}
.combo .fotos3 img+img{margin-left:-28px}
.combo .ct{display:flex;flex-direction:column;gap:4px;flex:1 1 180px;min-width:0}
.combo .ct b{color:var(--green);font-size:14px;letter-spacing:.14em;font-weight:800}
.combo .ct span{font-weight:800;font-size:21px;line-height:1.2}
.combo .cp{font-family:var(--display);font-size:54px;line-height:1;color:var(--green)}
.combo .cp small{font-size:20px;margin-right:3px}
.combo .buy{flex:1 1 100%;margin-top:6px;background:transparent;color:var(--green);border:2px solid var(--green)}
.combo .buy:hover{background:var(--green);color:var(--on-green)}
.combo .cpw{display:flex;flex-direction:column;align-items:center;gap:2px}
.combo .cde{font-size:13px;color:#C9D1FF;text-decoration:line-through}
.off{position:absolute;top:-14px;right:-6px;z-index:1;background:var(--green);color:var(--on-green);font-family:var(--display);font-size:22px;line-height:1;padding:4px 10px 5px;border-radius:9px;transform:rotate(4deg);box-shadow:0 0 0 2px var(--bg);display:flex;flex-direction:column;align-items:center}
.off small{font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:.12em;margin-bottom:2px}
.badge{background:var(--green);color:var(--on-green);font-family:var(--display);font-size:24px;line-height:1;padding:5px 12px;border-radius:8px;transform:rotate(-3deg)}
.obs{margin:0 0 12px;color:var(--muted);font-size:14px;font-weight:600}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:24px 14px}
.card{position:relative;flex:0 1 260px;width:min(100%,260px);background:var(--surface);border:2px solid var(--blue);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.card.feat{flex:1 1 100%;width:100%;background:var(--blue);border-color:var(--blue);color:#fff}
.ph{width:100%;height:190px;object-fit:contain;background:#fff;border-radius:10px;display:block}
.ph.none{display:flex;align-items:center;justify-content:center;background:#E6EBFB;color:#3F4A78;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.name{font-weight:700;font-size:16px;line-height:1.25;text-wrap:balance}
.de{font-size:13px;color:var(--muted);text-decoration:line-through}
.feat .de{color:#DCE4FF}
.por{font-family:var(--display);font-size:42px;line-height:1;color:var(--price);font-variant-numeric:tabular-nums}
.por small{font-size:18px;margin-right:4px}
.feat .por{color:#fff;font-size:56px}
.parc{align-self:center;background:var(--green);color:var(--on-green);font-weight:700;font-size:13px;border-radius:99px;padding:4px 11px;font-variant-numeric:tabular-nums}
.buy{align-self:stretch;margin-top:6px;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;border:2px solid var(--blue);color:var(--blue);font-weight:800;font-size:14px;text-decoration:none}
:root[data-theme="dark"] .buy{color:var(--price);border-color:var(--price)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .buy{color:var(--price);border-color:var(--price)}}
.feat .buy{background:#fff;color:var(--blue);border-color:#fff}
.buy:hover{background:var(--blue);color:#fff}
.feat .buy:hover{background:var(--green);color:var(--on-green);border-color:var(--green)}
.buy:focus-visible,.cta a:focus-visible{outline:3px solid var(--green);outline-offset:2px}
footer{border-top:1px solid var(--line);margin-top:34px;padding-top:20px;padding-bottom:20px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
footer strong{color:var(--fg);font-size:15px}
.cta{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.cta a{display:flex;align-items:center;justify-content:center;max-width:880px;margin:0 auto;min-height:52px;border-radius:12px;background:var(--green);color:var(--on-green);font-weight:800;font-size:17px;text-decoration:none}
</style>

<script>
// Vendedores (edite aqui; "ativo:false" desliga um número)
var VENDEDORES = [
  {nome:"V1", fone:"5585921011549", ativo:true},
  {nome:"V2", fone:"5585921011297", ativo:true}
];
// Origem do clique: use ?src=anuncio, ?src=bio etc. no link
var SRC = "bio";
try { SRC = (new URLSearchParams(location.search).get("src") || "bio").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,20) || "bio"; } catch(e){}
// Sorteio 50/50, fixo por visitante (volta sempre ao mesmo vendedor)
var VEND = null;
function escolher(){
  var ativos = VENDEDORES.filter(function(v){return v.ativo;});
  if (!ativos.length) ativos = VENDEDORES;
  var salvo = null;
  try { salvo = localStorage.getItem("pds_vend"); } catch(e){}
  for (var k=0;k<ativos.length;k++){ if (ativos[k].nome === salvo) return ativos[k]; }
  var v = ativos[Math.floor(Math.random()*ativos.length)];
  try { localStorage.setItem("pds_vend", v.nome); } catch(e){}
  return v;
}

  h += '<section><div class="head">' + (g.t ? '<h2>' + esc(g.t) + '</h2>' : '') + (g.badge ? '<span class="badge">' + esc(g.badge) + '</span>' : '') + '</div>';
  if (g.obs) h += '<p class="obs">' + esc(g.obs) + '</p>';
  h += '<div class="grid">';
  g.items.forEach(function(i){
    var msg = "Olá! Vi a Black Friday e quero saber da oferta: " + i.n + " por R$ " + i.p;
    h += '<article class="card"><span class="off"><small>ECONOMIZE</small>R$ ' + econ(i.d, i.p) + '</span>' +
      (i.i ? '<img class="ph" loading="lazy" src="' + F[i.i] + '" alt="' + esc(i.n) + '">' : '<div class="ph none">Foto em breve</div>') +
      '<div class="name">' + esc(i.n) + '</div>' +
      '<div class="de">De R$ ' + i.d + '</div>' +
      '<div class="por"><small>R$</small>' + i.p + '</div>' +
      '<div class="parc">ou 12x de R$ ' + i.c + ' no cartão</div>' +
      '<a class="buy" href="' + zap(msg) + '" target="_blank" rel="noopener">Pedir no WhatsApp</a></article>';
  });
  h += '</div></section>';
});
document.getElementById("vitrine").innerHTML = h;
